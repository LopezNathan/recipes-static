name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (fails on invalid frontmatter)
        run: npm run build
      - name: Type-check (including Pages Functions)
        run: npm run typecheck
      - name: Unit tests (merge + fractions)
        run: npm test
